<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Style</title>

        <style>
            h1 {
                color: blue;
                text-align: center;
            }

            p {
                color: red;
            }
        </style>
    </head>
    <body>
        <h1>Hello, world!</h1>
        <p>This is a paragraph.</p>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Nesting</title>

        <link rel="stylesheet" href="nesting.css">
    </head>

    <body>

        <div>
            <p>
                This is a paragraph inside the div.
            </p>

            <ul>
                <li>Item one</li>
                <li>Item two</li>
                <li>Item three</li>
            </ul>
        </div>

        <p>
            This is a paragraph outside the div.
        </p>

        <ul>
            <li>Item one</li>
            <li>Item two</li>
            <li>Item three</li>
        </ul>

    </body>
</html>

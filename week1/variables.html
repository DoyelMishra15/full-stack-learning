<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Variables</title>

        <style>
            :root {
                --main-color: blue;
            }

            h1 {
                color: var(--main-color);
            }

            p {
                color: var(--main-color);
            }
        </style>
    </head>

    <body>

        <h1>Hello, world!</h1>

        <p>This is a paragraph.</p>

    </body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Hover</title>

        <style>
            button {
                background-color: blue;
                color: white;
                padding: 10px;
            }

            button:hover {
                background-color: red;
            }
        </style>
    </head>

    <body>
        <button>Hover over me</button>
    </body>
</html>
